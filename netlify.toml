[build]
  command = "npm run build"
  publish  = ".next"

# The Next.js runtime handles the App Router, server components, route handlers
# and middleware. Without it Netlify serves the build as static files and every
# dynamic route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Staff responses are one-shot and personal to a moment; never let a CDN or an
# intermediary hold on to them.
[[headers]]
  for = "/respond/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
